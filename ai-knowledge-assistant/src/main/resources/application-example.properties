spring.application.name=ai-knowledge-assistant

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_knowledge_db
spring.datasource.username=postgres
spring.datasource.password=YOUR_PASSWORD

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3:latest
spring.ai.ollama.embedding.options.model=nomic-embed-text:latest

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Creates/updates tables (app_users, chat_entity.user_id, ...) on startup
spring.jpa.hibernate.ddl-auto=update

# Authentication (JWT). Use a long random value, e.g. `openssl rand -base64 48`.
# If left empty, a random secret is generated on startup and users are signed out on every restart.
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
app.jwt.expiration-hours=24

# Comma-separated list of frontend URLs allowed to call the API
app.cors.allowed-origins=http://localhost:5173
